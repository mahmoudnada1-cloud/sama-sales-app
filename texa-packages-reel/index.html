<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Texa room packages</title>
<style>
  /* Two faces only: one display, one UI. Point these at the brand's files in fonts/. */
  @font-face { font-family: Display; src: url(fonts/tajawal-arabic-900-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF; }
  @font-face { font-family: Display; src: url(fonts/tajawal-latin-900-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF,U+2000-206F,U+20AC; }
  @font-face { font-family: UI; src: url(fonts/tajawal-arabic-700-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF; }
  @font-face { font-family: UI; src: url(fonts/tajawal-latin-700-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF,U+2000-206F,U+20AC; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
